[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-continuity-community"
version = "0.1.0"
description = "Local observer-first, append-only continuity reference implementation"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [{name="ReLiC Community Contributors"}]
dependencies = []

[project.scripts]
relic-community = "relic_community.cli:main"

[tool.setuptools.packages.find]
include = ["relic_community*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
